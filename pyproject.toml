[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shelfr"
version = "0.3.0"
description = "Audiobook library automation - staging, metadata, uploads, and collection management"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"

dependencies = [
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "qbittorrent-api>=2024.1",
    "httpx[http2]>=0.27.0",
    "rich>=13.0",
    "pykakasi>=2.2.0",
    "jinja2>=3.1.0",
    "pydantic>=2.0",
    "pathvalidate>=3.0",
    "rapidfuzz>=3.0",
    # P0 upgrades: Better retry logic and cross-platform paths
    "tenacity>=8.0",
    "platformdirs>=4.0",
    # P1 upgrades: Better subprocess handling and type-safe config
    "sh>=2.2.2",
    "pydantic-settings>=2.0",
    # CLI framework: Typer with Rich integration
    "typer>=0.12.0",
    # Torrent file parsing (bencode format)
    "bencodepy>=0.9.5",
    # Rate limiting for API calls
    "aiolimiter>=1.1.0",
    # MLA title case for MAM compliance
    "titlecase>=2.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov",
    "ruff>=0.5.0",
    "mypy",
    "types-PyYAML",
    "pre-commit>=3.0",
]
tui = [
    "prompt_toolkit>=3.0.0",
    "pygments>=2.0.0",
    "textual>=0.89.0",
]

[project.scripts]
shelfr = "shelfr.cli:main"
Shelfr = "shelfr.cli:main"  # Deprecated alias

[tool.hatch.build.targets.wheel]
packages = ["src/shelfr"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "W",      # pycodestyle warnings
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "PTH",    # flake8-use-pathlib
    "RUF",    # Ruff-specific rules
]
ignore = [
    "PTH123", # open() vs Path.open() - allow both for flexibility
    "PTH116", # os.stat - sometimes needed for specific stat operations
    "PTH105", # os.replace - atomic rename, Path equivalent varies
    "PTH110", # os.path.exists - allow for legacy compatibility
    "PTH100", # os.path.abspath - allow when explicit needed
    "PTH107", # os.remove - allow for explicit file removal
    "RUF001", # ambiguous unicode - intentional in some strings
    "RUF003", # ambiguous unicode in comments - intentional
    "RUF005", # collection-literal-concatenation - sometimes clearer
    "SIM108", # ternary operator - if/else often more readable
]

# Allow fix for all enabled rules (when `--fix` is provided)
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
# Tests can use magic values, assertions, and longer lines
"tests/*" = ["PLR2004", "S101"]
# CLI module has intentionally deferred imports after docstring/setup
"src/shelfr/cli/__init__.py" = ["E402"]
# Deprecated shim module re-exports after deprecation warning
"src/shelfr/opf/__init__.py" = ["E402"]
# TUI module imports textual to check availability (intentional unused import)
"src/shelfr/tui/__init__.py" = ["F401"]

[tool.ruff.format]
# Use double quotes for strings (like Black)
quote-style = "double"
# Indent with spaces (like Black)
indent-style = "space"
# Respect magic trailing commas (like Black)
skip-magic-trailing-comma = false
# Auto-detect line endings
line-ending = "auto"
# Format code examples in docstrings
docstring-code-format = true

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = "pykakasi"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "bencodepy"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "textual.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "prompt_toolkit.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pygments.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["shelfr.tui.*", "shelfr.utils.mini_editor"]
# These modules use optional dependencies (textual, prompt_toolkit, pygments)
# that may not be installed. The try/except import pattern causes no-redef errors
# when deps are installed locally, and subclassing-any errors when they're not.
# Ignore errors for these files since they're well-tested and optional.
ignore_errors = true

[[tool.mypy.overrides]]
module = "tests.*"
# Relax type checking entirely for tests so development can proceed quickly.
# Tests can still be annotated incrementally where useful, but we don't require
# strict mypy checks across tests in local dev.
ignore_errors = true

[tool.coverage.run]
source = ["src/shelfr"]
omit = [
    # Optional dependency modules - can't be tested without textual/prompt_toolkit
    "src/shelfr/tui/*",
    "src/shelfr/utils/mini_editor.py",
]

[tool.coverage.report]
fail_under = 65
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "@abstractmethod",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]
filterwarnings = [
    # Textual's DirectoryTree starts async file watchers on import;
    # when testing CLI --help, these coroutines are never awaited (harmless)
    "ignore:coroutine 'DirectoryTree.watch_path' was never awaited:RuntimeWarning",
]

[tool.bandit]
exclude_dirs = ["tests", ".venv", "samples", "scripts"]
skips = [
    "B101",  # assert_used - we use asserts intentionally in tests and validators
    "B110",  # try_except_pass - intentional for non-critical fallbacks
    "B113",  # request_without_timeout - false positive (we do have timeouts)
    "B108",  # hardcoded_tmp_directory - intentional for container temp files
    "B311",  # random - not used for security, just UI variety
    "B324",  # hashlib weak - SHA1/MD5 used for non-security purposes (torrent info hash)
    "B404",  # import_subprocess - we need subprocess for Docker/shell commands
    "B405",  # import_xml - XML from trusted local files only
    "B603",  # subprocess_without_shell_equals_true - intentional for security
    "B607",  # start_process_with_partial_path - trusted binaries (mediainfo, etc.)
    "B701",  # jinja2_autoescape_false - generating BBCode, not HTML
]
